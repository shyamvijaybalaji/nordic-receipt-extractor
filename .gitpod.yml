# Validated on every change by .github/workflows/validate-gitpod.yml
image: node:24

tasks:
  - name: app
    init: npm install
    command: |
      if [ ! -f .env ]; then
        echo "No .env found — copy .env.example to .env and fill in your Supabase/n8n values first." \
          "See SETUP.md."
      fi
      npm run dev -- --host 0.0.0.0

ports:
  - port: 5173
    onOpen: open-preview
    visibility: private

vscode:
  extensions:
    - svelte.svelte-vscode
